<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Left Bracket Gradient -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Right Bracket Gradient -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#ambientGlow)" />

  <!-- Left Bracket < -->
  <path d="M192 170 L116 256 L192 342" fill="none" stroke="url(#leftGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <path d="M296 144 L216 368" fill="none" stroke="url(#slashGrad)" stroke-width="42" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M320 170 L396 256 L320 342" fill="none" stroke="url(#rightGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
</svg>
